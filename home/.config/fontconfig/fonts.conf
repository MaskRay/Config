<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!--
    Generic families. These must bind strongly: fontconfig ranks weak family
    scores below spacing (PRI_FAMILY_WEAK comes after PRI_SPACING in fcmatch.c),
    so with an <alias><prefer> list the spacing=mono Windows fonts in ~/.fonts
    (MS Gothic, NSimSun, MingLiU) won every Han codepoint under `monospace`.

    Latin faces come first; charset scoring outranks family, so Latin stops at
    the anchor and Han falls through to Source Han. Source Han Sans SC carries
    the whole pan-CJK repertoire, so it covers 繁体 too — no TC/K chain needed.
  -->
  <match target="pattern">
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Source Han Sans SC</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family"><string>serif</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Serif</string>
      <string>Source Han Serif SC</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family"><string>monospace</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>FantasqueSansM Nerd Font</string>
      <string>Source Code Pro</string>
      <string>Source Han Sans SC</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family"><string>Segoe UI Emoji</string></test>
    <edit name="family" mode="assign" binding="same"><string>Noto Color Emoji</string></edit>
  </match>

  <match target="pattern">
    <test name="family"><string>Microsoft YaHei</string></test>
    <edit name="family" mode="assign" binding="same"><string>Source Han Sans SC</string></edit>
  </match>

  <match target="font">
    <edit name="fontfeatures" mode="append">
      <string>liga off</string>
    </edit>
  </match>
</fontconfig>
